<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 96" width="128" height="192" role="img" aria-labelledby="t d">
  <title id="t">적응 영수증</title><desc id="d">절취선이 있는 영수증 테두리 안에서 새싹이 파도 위로 자라는 심볼</desc>
  <defs>
    <filter id="lg-ink" x="-5%" y="-5%" width="110%" height="110%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.1" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>
  <g filter="url(#lg-ink)" stroke-linecap="round" stroke-linejoin="round">
    <!-- 영수증 테두리: 둥근 윗모서리, 아랫변 절취선 -->
    <path d="M8 11q0-6 6-6h36q6 0 6 6v73l-4 4-4-4-4 4-4-4-4 4-4-4-4 4-4-4-4 4-4-4-4 4-4-4z" fill="none" stroke="#3a3a30" stroke-width="3"/>
    <!-- 잎 두 장 + 잎맥 -->
    <path d="M32 33C21 33 16 24 17 15c8 0 15 6 15 18z" fill="#6a7a3a"/>
    <path d="M32 33C43 33 48 24 47 15c-8 0-15 6-15 18z" fill="#6a7a3a"/>
    <path d="M20.5 18.5 31 31M43.5 18.5 33 31" fill="none" stroke="#fbfaf6" stroke-width="1.7"/>
    <!-- 줄기 → 파도 말림 -->
    <path d="M32 33v15c0 7-11 6-11 14 0 6 7 8 10 3" fill="none" stroke="#6a7a3a" stroke-width="4"/>
    <path d="M26 64c4-5 11-5 13 0 1 3 4 3 6 0" fill="none" stroke="#6a7a3a" stroke-width="4"/>
    <!-- 물결 두 줄 -->
    <path d="M18.5 72c3-3 6-3 9 0s6 3 9 0 6-3 9 0" fill="none" stroke="#6a7a3a" stroke-width="3.6"/>
    <path d="M18.5 79c3-3 6-3 9 0s6 3 9 0 6-3 9 0" fill="none" stroke="#6a7a3a" stroke-width="3.6"/>
  </g>
</svg>
